spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

# No default here on purpose — prod must fail fast at startup if this
# isn't injected via AWS Secrets Manager / SSM Parameter Store, rather
# than silently booting with a guessable fallback secret.
jwt:
  secret: ${JWT_SECRET}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.jamconnect.jamservice: INFO